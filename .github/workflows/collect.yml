name: 자동 수집

on:
  schedule:
    # 3시간마다 (UTC 기준 분 17). GitHub 사정으로 몇 분~수십 분 늦게 시작될 수 있다.
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "특정 플랫폼만 (airbnb, booking, trip). 비우면 전부"
        required: false
        default: ""
      debug_screenshots:
        description: "실패 화면 저장 (개인정보가 찍힐 수 있어 1일 뒤 자동 삭제)"
        type: boolean
        default: false

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # 비밀값을 아직 등록하지 않았으면 실패 메일이 쌓이지 않도록 조용히 건너뛴다.
      - name: 설정 확인
        id: cfg
        run: |
          if [ -n "$DATABASE_URL" ] && [ -n "$ENCRYPTION_KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::notice::DATABASE_URL·ENCRYPTION_KEY 비밀값이 없어 수집을 건너뜁니다."; fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      - if: steps.cfg.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.cfg.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.cfg.outputs.ok == 'true'
        run: npm ci
      - if: steps.cfg.outputs.ok == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.cfg.outputs.ok == 'true'
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: 수집 실행
        if: steps.cfg.outputs.ok == 'true'
        run: npm run collect -- "${CHANNEL}"
        env:
          CHANNEL: ${{ inputs.channel }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          OTP_WAIT_MINUTES: "8"
          DEBUG_SCREENSHOTS: ${{ inputs.debug_screenshots && '1' || '0' }}
      - if: ${{ always() && inputs.debug_screenshots && steps.cfg.outputs.ok == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: debug-screenshots/
          retention-days: 1
          if-no-files-found: ignore
